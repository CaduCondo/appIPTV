<!doctype html>
<html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/bundle.css"><link rel="stylesheet" href="css/app.css"><script src="js/react.production.min.js"></script><script src="js/react-dom.production.min.js"></script><script src="js/bundle.js"></script><script src="js/catalog.js"></script><script src="js/rules.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/demo.js"></script><title>Detalhe · CineHomeTV</title></head>
<body><div class="page"><div id="root"></div></div>
<script>
if (!CL.guard(true)) throw new Error('redirect');
var h = React.createElement, C = window.CinemaLivre;
var T = CL.q('t') === 'series' ? 'series' : 'movie', ID = CL.q('id');

function seasonKeys(eps) { return Object.keys(eps || {}).sort(function (a, b) { return a - b; }); }

function App() {
  var s = React.useState({ item: undefined, info: null, season: 0, rel: false, fav: false, msg: '', speaking: false, related: [] });
  var st = s[0];
  function set(p) { s[1](function (o) { return Object.assign({}, o, p); }); }

  React.useEffect(function () {
    CL.loadKind(T).then(function (list) {
      var item = list.filter(function (x) { return x.id === ID; })[0] || null;
      set({ item: item, fav: item ? CL.isFav(T, ID) : false, related: item ? list.filter(function (x) { return x.c === item.c && x.id !== item.id && x.p; }).slice(0, 12) : [] });
      if (item) {
        document.title = item.n + ' · CineHomeTV';
        if (item.info) set({ info: item.info });
        else CL.fetchInfo(T, item).then(function (info) { if (info) set({ info: info }); }).catch(function () {});
      }
    });
    return function () { if (window.speechSynthesis) speechSynthesis.cancel(); };
  }, []);

  if (st.item === undefined) return h('div', { className: 'msg' }, 'Carregando…');
  if (st.item === null) return h('div', null, h('div', { className: 'msg err' }, 'Título não encontrado nesta lista.'), h('div', { style: { marginTop: 16 } }, h(C.ActionButton, { icon: 'home', onClick: function () { location.href = 'home.html'; } }, 'Início')));

  var item = st.item, info = st.info || {};
  var eps = item.eps || info.eps || null, keys = seasonKeys(eps), sk = keys[st.season] || keys[0];
  var plot = info.plot || item.plot || '';
  var genres = String(info.genre || '').split(',').map(function (g) { return g.trim(); }).filter(Boolean);
  var castRaw = info.cast || [];
  var cast = Array.isArray(castRaw) ? castRaw : String(castRaw).split(',').map(function (n) { return { name: n.trim(), character: '', img: '' }; }).filter(function (c) { return c.name; });
  var rating = item.r || info.r || null;

  function play(ep, seasonKey) {
    var url = CL.streamUrl(T, item, ep);
    if (!url) return set({ msg: 'Este título é só uma vitrine de demonstração e não tem vídeo. Experimente os títulos da categoria "Cinema livre".' });
    var key = T === 'movie' ? 'movie:' + item.id : 'series:' + item.id + ':' + ep.id;
    var title = T === 'movie' ? item.n : item.n + ' · T' + seasonKey + ' E' + ep.num;
    var q = { u: url, title: title, p: ep && ep.img ? ep.img : item.p || '', t: T, id: item.id, key: key };
    if (T === 'series') { q.s = seasonKey; q.n = ep.num; q.eid = ep.id; q.pp = item.p || ''; }
    location.href = 'player.html?' + new URLSearchParams(q) + (CL.progressOf(key) > 0 && CL.progressOf(key) < 95 ? '&resume=1' : '');
  }
  function playMain() {
    if (T === 'movie') return play(null);
    var all = []; keys.forEach(function (k) { eps[k].forEach(function (e) { all.push({ e: e, k: k }); }); });
    var last = CL.history().filter(function (x) { return x.t === 'series' && x.id === item.id; })[0];
    var pick = all[0];
    if (last) { var i = all.findIndex(function (a) { return a.e.id === last.ep.eid; }); pick = i >= 0 ? (CL.progressOf(last.key) >= 95 && all[i + 1] ? all[i + 1] : all[i]) : all[0]; }
    if (pick) play(pick.e, pick.k); else set({ msg: 'Esta série ainda não tem episódios carregados.' });
  }
  function listen() {
    if (!window.speechSynthesis) return set({ msg: 'Seu navegador não tem leitura em voz alta.' });
    if (st.speaking) { speechSynthesis.cancel(); return set({ speaking: false }); }
    if (!plot) return set({ msg: 'Sem sinopse para ler.' });
    var u = new SpeechSynthesisUtterance(item.n + '. ' + plot); u.lang = 'pt-BR'; u.onend = function () { set({ speaking: false }); };
    speechSynthesis.speak(u); set({ speaking: true });
  }

  return h('div', null,
    h('div', { className: 'detail-top' },
      h('div', { className: 'detail-poster' },
        item.p ? h('img', { className: 'cl-art', src: item.p, alt: 'Pôster de ' + item.n, onError: function (e) { e.target.style.display = 'none'; } }) : h('div', { className: 'cl-art cl-ph cl-ph-0' }, item.n)),
      h('div', null,
        h('h1', { className: 'h-xl', style: { marginBottom: 12 } }, item.n),
        h(C.MetaChips, { year: item.y || undefined, rating: rating || undefined, source: 'Nota', genres: genres }),
        plot ? h('p', { className: 'plot' }, plot) : h('p', { className: 'plot muted' }, 'Sem sinopse nesta lista.'),
        st.msg && h('div', { className: 'msg', role: 'status', style: { marginBottom: 12 } }, st.msg),
        h('div', { className: 'btns' },
          h(C.ActionButton, { variant: 'primary', icon: 'play', onClick: playMain }, T === 'movie' ? (CL.progressOf('movie:' + item.id) > 0 ? 'Continuar' : 'Assistir') : 'Assistir'),
          h(C.ActionButton, { icon: 'heart', onClick: function () { set({ fav: CL.toggleFav(T, item.id) }); } }, st.fav ? 'Nos favoritos' : 'Favorito'),
          h(C.ActionButton, { icon: 'back', onClick: function () { history.length > 1 ? history.back() : (location.href = T === 'movie' ? 'filmes.html' : 'series.html'); } }, T === 'movie' ? 'Filmes' : 'Séries'),
          h(C.ActionButton, { icon: 'home', onClick: function () { location.href = 'home.html'; } }, 'Início'),
          h(C.ActionButton, { icon: 'related', onClick: function () { set({ rel: !st.rel }); } }, 'Relacionadas'),
          h(C.ActionButton, { icon: 'speaker', onClick: listen }, st.speaking ? 'Parar' : 'Ouvir')))),

    st.rel && h('div', null, h('h2', { className: 'h-sec' }, 'Relacionadas'),
      st.related.length ? h(C.Carousel, { perPage: 6 }, st.related.map(function (x) {
        return h(C.PosterCard, { key: x.id, title: x.n, year: x.y || undefined, rating: x.r || undefined, src: x.p, onClick: function () { location.href = 'detalhe.html?t=' + T + '&id=' + encodeURIComponent(x.id); } });
      }))
        : h('div', { className: 'msg' }, 'Nada parecido nesta lista.')),

    cast.length > 0 && h('div', null, h('h2', { className: 'h-sec' }, 'Elenco'),
      h(C.Carousel, { perPage: 8 }, cast.slice(0, 16).map(function (c, i) { return h(C.CastAvatar, { key: i, name: c.name, character: c.character, src: c.img || undefined }); }))),

    T === 'series' && keys.length > 0 && h('div', null, h('h2', { className: 'h-sec' }, 'Episódios'),
      h(C.SeasonTabs, { seasons: keys.map(function (k) { return { label: 'Temporada ' + (k.length < 2 ? '0' + k : k), episodes: eps[k].length }; }), active: Math.max(0, keys.indexOf(sk)), onSelect: function (i) { set({ season: i }); } }),
      h(C.Carousel, { key: 'ep' + sk, perPage: 4 }, (eps[sk] || []).map(function (e) {
        return h(C.EpisodeCard, { key: e.id, season: Number(sk), number: e.num, title: e.title, synopsis: e.plot, still: e.img || undefined, progress: CL.progressOf('series:' + item.id + ':' + e.id) || undefined, onClick: function () { play(e, sk); } });
      }))),
    T === 'series' && keys.length === 0 && h('div', { className: 'msg', style: { marginTop: 16 } }, 'Carregando episódios…')
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
CL.initNav();
</script></body></html>
