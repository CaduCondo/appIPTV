<!doctype html>
<html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/bundle.css"><link rel="stylesheet" href="css/app.css"><script src="js/react.production.min.js"></script><script src="js/react-dom.production.min.js"></script><script src="js/bundle.js"></script><script src="js/catalog.js"></script><script src="js/app.js"></script><script src="js/demo.js"></script><title>Perfis · Cinema Livre</title></head>
<body>
<div class="stage"><div class="stage__bg" id="bg"></div><div class="page"><div id="root"></div></div></div>
<div class="featured" id="feat"></div>
<script>
if (!CL.guard(false)) throw new Error('redirect');
var h = React.createElement, C = window.CinemaLivre;
var COLORS = ['brand', 'accent', 'danger', 'muted'];

/* pano de fundo: pôsteres do catálogo */
CL.loadKind('movie').then(function (m) {
  var pool = m.filter(function (x) { return x.p; }).slice(0, 200);
  for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  var pick = pool.slice(0, 18);
  document.getElementById('bg').innerHTML = pick.map(function (x) { return '<img alt="" src="' + x.p.replace(/"/g, '') + '">'; }).join('');
  if (pick[0]) document.getElementById('feat').innerHTML = '<div class="t"></div><div class="muted"></div>',
    document.querySelector('#feat .t').textContent = pick[0].n,
    document.querySelector('#feat .muted').textContent = [pick[0].y, 'em destaque'].filter(Boolean).join(' · ');
});

function App() {
  var s = React.useState({ list: CL.profiles(), mode: CL.q('novo') || !CL.profiles().length ? 'new' : 'pick', edit: null, name: '', color: 'brand', editing: false });
  var st = s[0];
  function set(p) { s[1](Object.assign({}, st, p)); }
  function refresh(p) { set(Object.assign({ list: CL.profiles() }, p)); }
  function choose(p) { if (st.editing) return set({ mode: 'form', edit: p.id, name: p.name, color: p.color }); CL.setActive(p.id); location.href = 'home.html'; }
  function save() {
    var n = st.name.trim(); if (!n) return;
    if (st.edit) CL.updateProfile(st.edit, n, st.color); else { var p = CL.addProfile(n, st.color); if (!st.editing) { CL.setActive(p.id); location.href = 'home.html'; return; } }
    refresh({ mode: 'pick', edit: null, name: '', color: 'brand' });
  }
  function remove() { CL.removeProfile(st.edit); var l = CL.profiles(); refresh({ mode: l.length ? 'pick' : 'new', edit: null, name: '' }); }

  var meta = CL.meta() || {};
  var head = h('div', null,
    h('div', { className: 'brand-mark' }, 'Cinema ', h('b', null, 'Livre')),
    h('h1', { className: 'h-title', style: { marginTop: 24, fontSize: 28, lineHeight: '34px' } }, st.mode === 'new' ? 'Novo perfil' : st.mode === 'form' ? 'Editar perfil' : 'Quem está assistindo?'),
    meta.kind === 'demo' && h('div', { style: { marginTop: 8 } }, h('span', { className: 'badge-demo' }, 'Modo demonstração')));

  if (st.mode === 'new' || st.mode === 'form') {
    return h('div', null, head,
      h('div', { className: 'form', style: { marginTop: 24, width: 420 } },
        h(C.Field, { label: 'Nome do perfil', value: st.name, onChange: function (v) { set({ name: v }); }, onKeyDown: function (e) { if (e.key === 'Enter') save(); }, autoFocus: true, placeholder: 'Ex.: Pai, Ana, Crianças' }),
        h('div', null, h('div', { className: 'cl-field__label' }, 'Cor'),
          h('div', { className: 'swatches' }, COLORS.map(function (c) {
            return h('button', { key: c, type: 'button', 'aria-label': c, className: 'swatch cl-av-' + c + (st.color === c ? ' is-on' : ''), onClick: function () { set({ color: c }); } });
          }))),
        h('div', { className: 'btns' },
          h(C.ActionButton, { variant: 'primary', icon: 'check', onClick: save }, 'Salvar'),
          (st.list.length > 0) && h(C.ActionButton, { icon: 'back', onClick: function () { set({ mode: 'pick', edit: null, name: '' }); } }, 'Cancelar'),
          st.mode === 'form' && h(C.ActionButton, { icon: 'logout', onClick: remove }, 'Excluir perfil')
        )));
  }
  return h('div', null, head,
    h('div', { className: 'profiles' },
      st.list.map(function (p) { return h(C.ProfileItem, { key: p.id, name: p.name, color: p.color, active: CL.get('active') === p.id && !st.editing, onClick: function () { choose(p); } }); }),
      h(C.ProfileItem, { variant: 'add', name: 'Novo perfil', onClick: function () { set({ mode: 'new', name: '', color: COLORS[st.list.length % 4] }); } }),
      h('div', { style: { marginTop: 8 } }, h(C.ActionButton, { variant: st.editing ? 'primary' : 'secondary', onClick: function () { set({ editing: !st.editing }); } }, st.editing ? 'Concluir' : 'Editar perfis'))
    ));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
CL.initNav();
</script></body></html>
