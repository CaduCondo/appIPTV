<!doctype html>
<html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/bundle.css"><link rel="stylesheet" href="css/app.css"><script src="js/react.production.min.js"></script><script src="js/react-dom.production.min.js"></script><script src="js/bundle.js"></script><script src="js/catalog.js"></script><script src="js/rules.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/demo.js"></script><title>Esqueci minha senha · CineHomeTV</title></head>
<body><div class="page"><div id="root"></div></div>
<script>
var h = React.createElement, C = window.CinemaLivre;
function App() {
  var s = React.useState({ u: '', msg: '', busy: false }), st = s[0];
  function set(p) { s[1](function (o) { return Object.assign({}, o, p); }); }
  function enviar() {
    if (!st.u.trim()) return set({ msg: '' });
    set({ busy: true });
    CL.auth.pedirRecuperacao(st.u.trim()).then(function (r) { set({ busy: false, msg: r.mensagem }); });
  }
  return h('div', { style: { maxWidth: 520 } },
    h('div', { className: 'brand-mark' }, 'CineHome', h('b', null, 'TV')),
    h('h1', { className: 'h-title', style: { margin: '24px 0 8px' } }, 'Esqueci minha senha'),
    h('p', { className: 'muted', style: { font: '500 18px/26px var(--font-sans)' } }, 'Digite o seu usuário. Se houver um e-mail cadastrado, enviamos um código para ele. Sem e-mail, peça uma senha nova ao administrador.'),
    h('div', { className: 'form', style: { width: '100%' } },
      h(C.Field, { label: 'Usuário', value: st.u, onChange: function (v) { set({ u: v.replace(/\D/g, '').slice(0, 11) }); }, onKeyDown: function (e) { if (e.key === 'Enter') enviar(); }, autoFocus: true }),
      st.msg && h('div', { className: 'msg', role: 'status' }, st.msg),
      h('div', { className: 'btns' }, h(C.ActionButton, { variant: 'primary', icon: 'check', onClick: enviar }, st.busy ? 'Enviando…' : 'Enviar código'), h(C.ActionButton, { icon: 'back', onClick: function () { location.href = 'entrar.html'; } }, 'Voltar'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
CL.initNav();
</script></body></html>
