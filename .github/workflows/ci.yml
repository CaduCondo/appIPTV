name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logica:
    name: Testes de lógica (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:unit

  smoke:
    name: Smoke (BDD, caminho crítico)
    needs: logica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/robot/requirements.txt
      - run: pip install -r tests/robot/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Rodar o smoke
        run: python -m robot --include smoke --outputdir results/smoke tests/robot/features
      - name: Guardar relatório, prints e vídeos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-smoke
          path: results
          retention-days: 14

  regressao:
    name: Regressão (BDD, todas as telas)
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/robot/requirements.txt
      - run: pip install -r tests/robot/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Rodar a regressão
        run: python -m robot --exclude smoke --outputdir results/regressao tests/robot/features
      - name: Guardar relatório, prints e vídeos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-regressao
          path: results
          retention-days: 14
