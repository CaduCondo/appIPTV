<!doctype html>
<html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/bundle.css"><link rel="stylesheet" href="css/app.css"><script src="js/react.production.min.js"></script><script src="js/react-dom.production.min.js"></script><script src="js/bundle.js"></script><script src="js/catalog.js"></script><script src="js/rules.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/demo.js"></script><title>Perfil · CineHomeTV</title></head>
<body><div class="page"><div id="root"></div></div>
<script>
/* Perfil: tudo que é específico do usuário (Trocar perfil, Configurações, Ajustes, Plano). */
if (!CL.guard(true)) throw new Error('redirect');
var h = React.createElement, C = window.CinemaLivre, prof = CL.profile();
ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
  h('div', { className: 'topbar' }, h('h1', { className: 'h-title' }, 'Perfil'), h('div', { className: 'btns' }, h(C.ActionButton, { icon: 'home', onClick: function () { location.href = 'home.html'; } }, 'Início'))),
  h('div', { style: { display: 'flex', alignItems: 'center', gap: 16, marginBottom: 24 } },
    h(C.ProfileItem, { name: prof.name, color: prof.color, active: true }),
    h('span', { className: 'muted', style: { font: '500 18px/24px var(--font-sans)' } }, 'Usuário ' + CL.usuario() + (CL.isAdmin() ? ' · administrador' : ''))),
  h('div', { className: 'hub3 hub4' },
    h(C.HubTile, { icon: 'user', title: 'Trocar perfil', subtitle: 'Quem está assistindo', onClick: function () { location.href = 'perfis.html'; } }),
    h(C.HubTile, { icon: 'settings', title: 'Configurações', subtitle: 'Conta e lista', onClick: function () { location.href = 'contas.html'; } }),
    h(C.HubTile, { icon: 'settings', title: 'Ajustes', subtitle: 'Preferências', onClick: function () { location.href = 'embreve.html?t=Ajustes'; } }),
    h(C.HubTile, { big: true, icon: 'star', title: 'Plano', subtitle: 'Seu plano e opções', onClick: function () { location.href = 'plano.html'; } })),
  h('div', { className: 'btns', style: { marginTop: 24 } },
    CL.isAdmin() && h(C.ActionButton, { icon: 'plus', onClick: function () { location.href = 'criar-usuario.html'; } }, 'Criar usuário'),
    h(C.ActionButton, { icon: 'logout', onClick: function () { CL.logout(); } }, 'Sair da conta'))));
CL.initNav();
</script></body></html>
